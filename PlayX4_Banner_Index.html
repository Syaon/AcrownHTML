<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 PlayX4 에이크라운 굿즈 배너 선택</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
        }
        
        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .banner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            padding: 20px;
        }
        
        .banner-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        
        .banner-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .banner-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
            -webkit-user-drag: none;
            user-select: none;
            pointer-events: none;
        }
        
        .banner-info {
            padding: 20px;
        }
        
        .banner-info h2 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5em;
        }
        
        .banner-info p {
            color: #666;
            font-size: 1em;
            line-height: 1.5;
        }
        
        .banner-tag {
            display: inline-block;
            padding: 5px 15px;
            background-color: #007bff;
            color: white;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 15px;
        }
        
        .footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.9em;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }
        
        @media (max-width: 768px) {
            .banner-grid {
                grid-template-columns: 1fr;
                padding: 10px;
            }
            
            .header h1 {
                font-size: 1.5em;
            }
            
            .header p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>2025 PlayX4 에이크라운 굿즈 배너</h1>
        <p>보고자 하는 배너를 선택해주세요</p>
    </div>
    
    <div class="banner-grid">
        <a href="PlayX4_Banner_Main.html" class="banner-card">
            <img src="IMG_001.jpg" alt="메인 배너" class="banner-image">
            <div class="banner-info">
                <h2>A 배너</h2>
                <p>아자, 웰, 댱이, 메인 단체</p>
                <span class="banner-tag">클릭</span>
            </div>
        </a>
        
        <a href="PlayX4_Banner_Sub.html" class="banner-card">
            <img src="IMG_002.jpg" alt="서브 배너" class="banner-image">
            <div class="banner-info">
                <h2>B 배너</h2>
                <p>솔맹 , 넬리 , 기주 , 미노</p>
                <span class="banner-tag">클릭</span>
            </div>
        </a>
        
        <a href="PlayX4_Banner_Plus.html" class="banner-card">
            <img src="IMG_003.jpg" alt="플러스 배너" class="banner-image">
            <div class="banner-info">
                <h2>C 배너</h2>
                <p>리호 , 에반 , 시안 , 안도</p>
                <span class="banner-tag">클릭</span>
            </div>
        </a>
    </div>
    
    <div class="footer">
        © ACROWN COSPLAY TEAM 2025
    </div>

    <script>
        // 우클릭 방지
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // 드래그 방지
        document.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
        });

        // 개발자 도구 단축키 방지
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'F12') || 
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });

        // 이미지 다운로드 방지
        document.querySelectorAll('.banner-image').forEach(function(img) {
            img.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            img.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            });
        });
    </script>
</body>
</html>
