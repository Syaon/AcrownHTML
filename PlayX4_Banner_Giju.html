<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayX4 배너</title>
    <style>
        body {
            background-color: transparent;
            margin: 0; /* 기본 마진 제거 */
            display: flex; /* 이미지를 중앙 정렬하기 위함 (선택 사항) */
            justify-content: center; /* 이미지를 가로 중앙 정렬 (선택 사항) */
            align-items: center; /* 이미지를 세로 중앙 정렬 (선택 사항) */
        }
        img {
            max-width: 100%; /* 이미지가 부모 요소를 넘어가지 않도록 설정 */
            height: auto; /* 이미지 비율 유지 */
        }
    </style>
</head>
<body>
    <img src="IMG_2892.JPG" alt="샘플 이미지">
</body>
</html>
