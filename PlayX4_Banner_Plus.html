<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 PlayX4 에이크라운 굿즈 배너 B</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background-color: #fff;
            overflow-x: hidden;
            overflow-y: auto;
        }
        
        #image-wrapper {
            width: 100%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        #main-image {
            width: 100%;
            height: auto;
            display: block;
            -webkit-user-drag: none;
            transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            cursor: grab;
            will-change: transform;
            transform-origin: center center;
        }
        
        #main-image.grabbing {
            cursor: grabbing;
            transition: none;
        }
        
        .watermark {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            z-index: 100;
            padding: 8px;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        
        /* 줌 버튼 스타일 */
        .zoom-controls {
            position: fixed;
            bottom: 70px;
            right: 20px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .zoom-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: background-color 0.2s ease;
        }
        
        .zoom-btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        
        /* 모바일 디바이스 */
        @media (max-width: 768px) {
            .watermark {
                font-size: 12px;
                padding: 5px;
                bottom: 10px;
            }
            
            .zoom-controls {
                bottom: 50px;
                right: 10px;
            }
            
            .zoom-btn {
                width: 35px;
                height: 35px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="image-wrapper">
        <img id="main-image" src="IMG_003.JPG" alt="2025 플레이엑스포 에이크라운 굿즈 이미지 C">
    </div>
    
    <div class="watermark">© ACROWN COSPLAY TEAM 2025</div>
    
    <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in">+</button>
        <button class="zoom-btn" id="zoom-out">-</button>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 이미지 요소
            var mainImage = document.getElementById('main-image');
            var imageWrapper = document.getElementById('image-wrapper');
            var zoomInBtn = document.getElementById('zoom-in');
            var zoomOutBtn = document.getElementById('zoom-out');
            
            // 우클릭 방지
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            // 확대/축소 변수 (기본값은 축소 없음)
            var scale = 1;
            var translateX = 0;
            var translateY = 0;
            var isDragging = false;
            var startX, startY;
            var lastX, lastY;
            var isAnimating = false;
            
            // 이미지 변환 적용 함수
            function applyTransform() {
                if (!isAnimating) {
                    isAnimating = true;
                    mainImage.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
                    
                    // 애니메이션 완료 후 상태 초기화
                    setTimeout(function() {
                        isAnimating = false;
                    }, 300); // transition 시간과 동일하게 설정
                }
            }
            
            // 줌 인 버튼 클릭
            zoomInBtn.addEventListener('click', function() {
                if (scale < 3) {
                    scale += 0.1;
                    applyTransform();
                }
            });
            
            // 줌 아웃 버튼 클릭
            zoomOutBtn.addEventListener('click', function() {
                if (scale > 0.5) {
                    scale -= 0.1;
                    // 축소 시 위치 초기화
                    if (scale <= 1) {
                        translateX = 0;
                        translateY = 0;
                    }
                    applyTransform();
                }
            });
            
            // 마우스 휠로 확대/축소 (PC용)
            document.addEventListener('wheel', function(e) {
                if (e.ctrlKey) {
                    e.preventDefault();
                    var delta = e.deltaY < 0 ? 0.1 : -0.1;
                    var newScale = scale + delta;
                    
                    if (newScale < 0.5) newScale = 0.5;
                    if (newScale > 3) newScale = 3;
                    
                    // 축소 시 위치 초기화
                    if (newScale <= 1 && scale > 1) {
                        translateX = 0;
                        translateY = 0;
                    }
                    
                    scale = newScale;
                    applyTransform();
                }
            }, { passive: false });
            
            // 마우스 드래그 이벤트 (PC용)
            mainImage.addEventListener('mousedown', function(e) {
                // 확대된 상태에서만 드래그 허용
                if (scale > 1) {
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    lastX = translateX;
                    lastY = translateY;
                    mainImage.classList.add('grabbing');
                    e.preventDefault();
                }
            });
            
            document.addEventListener('mousemove', function(e) {
                if (isDragging) {
                    // 움직인 거리 계산
                    var dx = (e.clientX - startX) / scale;
                    var dy = (e.clientY - startY) / scale;
                    
                    // 새로운 위치 계산
                    translateX = lastX + dx;
                    translateY = lastY + dy;
                    
                    // 변환 적용 (드래그 중에는 애니메이션 없음)
                    mainImage.style.transition = 'none';
                    mainImage.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
                }
            });
            
            document.addEventListener('mouseup', function() {
                if (isDragging) {
                    isDragging = false;
                    mainImage.classList.remove('grabbing');
                    mainImage.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1)';
                }
            });
            
            document.addEventListener('mouseleave', function() {
                if (isDragging) {
                    isDragging = false;
                    mainImage.classList.remove('grabbing');
                    mainImage.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1)';
                }
            });
            
            // 터치 이벤트 (모바일용)
            var initialDistance = 0;
            var initialScale = 1;
            var lastTouchX, lastTouchY;
            
            mainImage.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    // 단일 터치 (드래그)
                    if (scale > 1) {
                        isDragging = true;
                        startX = e.touches[0].clientX;
                        startY = e.touches[0].clientY;
                        lastTouchX = translateX;
                        lastTouchY = translateY;
                        mainImage.style.transition = 'none';
                        e.preventDefault();
                    }
                } else if (e.touches.length === 2) {
                    // 두 손가락 터치 (핀치 줌)
                    isDragging = false;
                    initialDistance = getDistance(e.touches[0], e.touches[1]);
                    initialScale = scale;
                    e.preventDefault();
                }
            }, { passive: false });
            
            mainImage.addEventListener('touchmove', function(e) {
                if (e.touches.length === 1 && isDragging) {
                    // 단일 터치 드래그
                    var dx = (e.touches[0].clientX - startX) / scale;
                    var dy = (e.touches[0].clientY - startY) / scale;
                    
                    translateX = lastTouchX + dx;
                    translateY = lastTouchY + dy;
                    
                    mainImage.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
                    e.preventDefault();
                } else if (e.touches.length === 2) {
                    // 핀치 줌
                    var currentDistance = getDistance(e.touches[0], e.touches[1]);
                    var newScale = initialScale * (currentDistance / initialDistance);
                    
                    if (newScale < 0.5) newScale = 0.5;
                    if (newScale > 3) newScale = 3;
                    
                    // 축소 시 위치 초기화
                    if (newScale <= 1 && scale > 1) {
                        translateX = 0;
                        translateY = 0;
                    }
                    
                    scale = newScale;
                    mainImage.style.transform = `scale(${scale}) translate(${translateX}px, ${translateY}px)`;
                    e.preventDefault();
                }
            }, { passive: false });
            
            mainImage.addEventListener('touchend', function() {
                if (isDragging) {
                    isDragging = false;
                    mainImage.style.transition = 'transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1)';
                }
            });
            
            // 두 터치 포인트 간의 거리 계산
            function getDistance(touch1, touch2) {
                var dx = touch1.clientX - touch2.clientX;
                var dy = touch1.clientY - touch2.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }
            
            // 이미지 드래그 방지 (기본 브라우저 동작)
            mainImage.addEventListener('dragstart', function(e) {
                e.preventDefault();
                return false;
            });
            
            // 개발자 도구 단축키 방지
            document.addEventListener('keydown', function(e) {
                if ((e.key === 'F12') || 
                    (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                    (e.ctrlKey && e.key === 'u')) {
                    e.preventDefault();
                    return false;
                }
            });
        });
    </script>
</body>
</html>
